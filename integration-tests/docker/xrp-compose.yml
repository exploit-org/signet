services:
  rippled:
    image: rippleci/rippled:2.6.2@sha256:2586c8aeff8a54cc4049036e39266d8ac708d01b7802d8625121c4de2c927ce9
    platform: linux/amd64
    command: ["--standalone", "--start", "--conf", "/etc/opt/ripple/rippled.cfg"]
    ports:
      - "127.0.0.1::51234"
    volumes:
      - ./xrp/rippled.cfg:/etc/opt/ripple/rippled.cfg:ro
    labels:
      org.exploit.signet.test-run: "${SIGNET_TEST_RUN:?SIGNET_TEST_RUN is required}"
