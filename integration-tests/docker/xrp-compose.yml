services:
  rippled:
    image: xrpllabsofficial/xrpld:3.3.0@sha256:353d5e016bb93519e9fcac715cdc8c2205b96c4cfe2d1f0f1d22a22f6efaff70
    platform: linux/amd64
    entrypoint: /usr/bin/xrpld
    command: ["--standalone", "--start", "--conf", "/etc/opt/ripple/rippled.cfg"]
    ports:
      - "127.0.0.1::51234"
    volumes:
      - ./xrp/rippled.cfg:/etc/opt/ripple/rippled.cfg:ro
    labels:
      org.exploit.signet.test-run: "${SIGNET_TEST_RUN:?SIGNET_TEST_RUN is required}"
