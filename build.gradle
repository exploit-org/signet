plugins {
    id 'base'
    id 'tech.yanand.maven-central-publish' version '1.2.0'
}

group = 'org.exploit.signet'
version = findProperty('releaseVersion') ?: '0.1.3'

def firstPropertyOrEnv = { List<String> propertyNames, List<String> envNames ->
    for (def propertyName : propertyNames) {
        def value = findProperty(propertyName)
        if (value != null && !value.toString().isBlank())
            return value.toString()
    }

    for (def envName : envNames) {
        def value = System.getenv(envName)
        if (value != null && !value.isBlank())
            return value
    }

    return null
}

def splitBasicAuthToken = { token ->
    if (token == null || token.toString().isBlank())
        return null

    def value = token.toString()
    if (!value.contains(':')) {
        try {
            value = new String(Base64.decoder.decode(value), java.nio.charset.StandardCharsets.UTF_8)
        } catch (IllegalArgumentException ignored) {
            return null
        }
    }

    def separator = value.indexOf(':')
    if (separator <= 0 || separator == value.length() - 1)
        return null

    return [value.substring(0, separator), value.substring(separator + 1)]
}

def centralMavenBasicCredentials = splitBasicAuthToken(findProperty('centralMavenToken'))

