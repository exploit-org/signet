    signetSnapshotRepositoryPassword = firstPropertyOrEnv(
            ['snapshotRepositoryPassword', 'mavenCentralPassword', 'centralMavenPassword', 'centralPassword', 'sonatypePassword'],
            ['SNAPSHOT_REPOSITORY_PASSWORD', 'MAVEN_CENTRAL_PASSWORD', 'CENTRAL_MAVEN_PASSWORD', 'CENTRAL_PASSWORD', 'SONATYPE_PASSWORD']
    ) ?: centralMavenBasicCredentials?.get(1)

    signetProjectPom = [
            ':spi'                        : [
