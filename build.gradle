            ':evm:evm-spi',
            ':evm:evm-contracts',
            ':tron',
            ':solana',
            ':ton',
            ':xrp',
            ':xlm',
            ':blockbook',
            ':blockbook:blockbook-bitcoin',
            ':blockbook:blockbook-evm',
            ':blockbook:blockbook-tron'
