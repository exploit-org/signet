            ':crypto-util'                : [
                    name       : 'Signet Crypto Util',
                    description: 'Shared encoding and cryptographic helpers for Signet modules.'
            ],
            ':secp256k1-support'          : [
                    name       : 'Signet secp256k1 Support',
                    description: 'secp256k1 keys and signing support for Signet.'
            ],
            ':ed25519-support'            : [
                    name       : 'Signet Ed25519 Support',
                    description: 'Ed25519 keys and signing support for Signet.'
            ],
            ':bitcoin'                    : [
                    name       : 'Signet Bitcoin',
                    description: 'Bitcoin blockchain support for Signet.'
            ],
            ':evm'                        : [
                    name       : 'Signet EVM',
                    description: 'EVM blockchain support for Signet.'
            ],
            ':evm:evm-spi'                : [
                    name       : 'Signet EVM SPI',
                    description: 'Shared EVM interfaces for Signet.'
            ],
            ':evm:evm-contracts'          : [
                    name       : 'Signet EVM Contracts',
                    description: 'EVM contract support for Signet.'
            ],
            ':tron'                       : [
                    name       : 'Signet TRON',
                    description: 'TRON blockchain support for Signet.'
            ],
            ':solana'                     : [
                    name       : 'Signet Solana',
                    description: 'Solana blockchain support for Signet.'
            ],
            ':ton'                        : [
                    name       : 'Signet TON',
                    description: 'TON wallet and transfer support for Signet.'
            ],
            ':xrp'                        : [
                    name       : 'Signet XRP',
                    description: 'XRP Ledger support for Signet.'
            ],
            ':xlm'                        : [
                    name       : 'Signet XLM',
                    description: 'Stellar accounts, transactions and signing support for Signet.'
            ],
            ':blockbook'                  : [
                    name       : 'Signet Blockbook',
                    description: 'Shared Blockbook indexer integration for Signet.'
            ],
            ':blockbook:blockbook-bitcoin': [
                    name       : 'Signet Blockbook Bitcoin',
                    description: 'Bitcoin Blockbook integration for Signet.'
