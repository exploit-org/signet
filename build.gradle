def configurePom = { MavenPublication publication, Project p ->
    def metadata = rootProject.ext.signetProjectPom[p.path]

    publication.pom {
        name = metadata.name
        description = metadata.description
        url = rootProject.ext.signetPomUrl

        licenses {
            license {
                name = 'Apache License 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }

        developers {
            developer {
                id = rootProject.ext.signetDeveloperId
                name = rootProject.ext.signetDeveloperName
                email = rootProject.ext.signetDeveloperEmail
            }
        }

        scm {
            connection = rootProject.ext.signetScmConnection
            developerConnection = rootProject.ext.signetScmDeveloperConnection
            url = rootProject.ext.signetScmUrl
        }
    }
}

def configureMavenCentralSnapshotRepository = { repository ->
    repository.name = 'MavenCentralSnapshots'
    repository.url = rootProject.uri(rootProject.ext.signetSnapshotRepositoryUrl)
    repository.mavenContent {
        snapshotsOnly()
    }

    if (rootProject.ext.signetSnapshotRepositoryUsername && rootProject.ext.signetSnapshotRepositoryPassword) {
        repository.credentials {
            username = rootProject.ext.signetSnapshotRepositoryUsername.toString()
            password = rootProject.ext.signetSnapshotRepositoryPassword.toString()
        }
    }
}

mavenCentral {
    repoDir = layout.buildDirectory.dir('repos/central-bundles')
    authToken = findProperty('centralMavenToken') ?: ''
    publishingType = 'USER_MANAGED'
}

tasks.register('validateMavenCentralSnapshotPublication') {
    group = 'publishing'
    description = 'Validates Maven Central snapshot publishing configuration.'

    doLast {
        if (!version.toString().endsWith('-SNAPSHOT')) {
            throw new GradleException("Snapshot publication requires -PreleaseVersion=<version>-SNAPSHOT; current version is ${version}.")
        }

        if (!rootProject.ext.signetSnapshotRepositoryUsername || !rootProject.ext.signetSnapshotRepositoryPassword) {
            throw new GradleException(
                    'Missing Maven Central snapshot credentials. Set snapshotRepositoryUsername/snapshotRepositoryPassword ' +
                            'or compatible Maven Central/Sonatype username/password properties or environment variables.'
            )
        }
    }
}

allprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }
}

configure(rootProject.ext.signetJavaProjects.collect { project(it) }) {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }

        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(Javadoc).configureEach {
        failOnError = false

        options.encoding = 'UTF-8'
        options.addStringOption('Xdoclint:none', '-quiet')
        options.addBooleanOption('html5', true)
    }

    tasks.withType(Jar).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    publishing {
        publications {
            maven(MavenPublication) {
                from components.java
                configurePom(delegate, project)
            }
        }

        repositories {
            maven {
                name = 'CentralBundle'
                url = rootProject.layout.buildDirectory.dir('repos/central-bundles')
            }
            maven(configureMavenCentralSnapshotRepository)
        }
    }

    tasks.matching {
        it.name == 'publishAllPublicationsToMavenCentralSnapshotsRepository' ||
                it.name == 'publishMavenPublicationToMavenCentralSnapshotsRepository'
    }.configureEach {
        dependsOn rootProject.tasks.named('validateMavenCentralSnapshotPublication')
    }

    signing {
        def signingKey = findProperty('signingKey')
        if (signingKey) {
            def decodedSigningKey = new String(Base64.mimeDecoder.decode(signingKey.toString()), "UTF-8")

            if (!decodedSigningKey.startsWith("-----BEGIN PGP PRIVATE KEY BLOCK-----")) {
                throw new GradleException("signingKey is not base64 of an armored private key")
            }

            useInMemoryPgpKeys(decodedSigningKey, findProperty('signingPassword')?.toString())
        }

        required {
            gradle.taskGraph.allTasks.any { task ->
                task.name.toLowerCase(Locale.ROOT).contains('publish') ||
                        task.name.toLowerCase(Locale.ROOT).contains('sign')
            }
        }

        sign publishing.publications.maven
    }
}

project(':bom') {
    apply plugin: 'java-platform'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    javaPlatform {
        allowDependencies()
    }

    dependencies {
        constraints {
            rootProject.ext.signetJavaProjects.each { projectPath ->
                api project(projectPath)
            }
        }
    }

    publishing {
        publications {
            maven(MavenPublication) {
                from components.javaPlatform
                configurePom(delegate, project)
            }
        }

        repositories {
            maven {
                name = 'CentralBundle'
                url = rootProject.layout.buildDirectory.dir('repos/central-bundles')
            }
            maven(configureMavenCentralSnapshotRepository)
        }
    }

    tasks.matching {
        it.name == 'publishAllPublicationsToMavenCentralSnapshotsRepository' ||
                it.name == 'publishMavenPublicationToMavenCentralSnapshotsRepository'
    }.configureEach {
        dependsOn rootProject.tasks.named('validateMavenCentralSnapshotPublication')
    }

    signing {
        def signingKey = findProperty('signingKey')
        if (signingKey) {
            def decodedSigningKey = new String(Base64.mimeDecoder.decode(signingKey.toString()), "UTF-8")

            if (!decodedSigningKey.startsWith("-----BEGIN PGP PRIVATE KEY BLOCK-----")) {
                throw new GradleException("signingKey is not base64 of an armored private key")
            }

            useInMemoryPgpKeys(decodedSigningKey, findProperty('signingPassword')?.toString())
        }

        required {
            gradle.taskGraph.allTasks.any { task ->
                task.name.toLowerCase(Locale.ROOT).contains('publish') ||
                        task.name.toLowerCase(Locale.ROOT).contains('sign')
            }
        }

        sign publishing.publications.maven
    }
}

tasks.register('buildNoTests') {
    group = 'build'
    description = 'Builds all Signet modules with unit tests, excluding node integration suites.'
    dependsOn((rootProject.ext.signetJavaProjects + [':bom']).collect {
        "${it}:build"
    })
}

tasks.register('publishAllToCentralBundle') {
    group = 'publishing'
    description = 'Publishes every Signet publication into build/repos/central-bundles.'
    dependsOn((rootProject.ext.signetJavaProjects + [':bom']).collect {
        "${it}:publishAllPublicationsToCentralBundleRepository"
    })
}

tasks.register('publishAllToMavenCentralPortal') {
    group = 'publishing'
    description = 'Uploads every Signet publication bundle to Maven Central Portal.'
    dependsOn(tasks.named('publishToMavenCentralPortal'))
}

tasks.register('publishAllToMavenCentralSnapshots') {
    group = 'publishing'
    description = 'Publishes every Signet -SNAPSHOT publication to Maven Central Portal snapshots.'
    dependsOn((rootProject.ext.signetJavaProjects + [':bom']).collect {
        "${it}:publishAllPublicationsToMavenCentralSnapshotsRepository"
    })
}

tasks.register('publishAllToSnapshotRepository') {
    group = 'publishing'
    description = 'Alias for publishAllToMavenCentralSnapshots.'
    dependsOn(tasks.named('publishAllToMavenCentralSnapshots'))
}

tasks.register('publishAllToMavenLocal') {
    group = 'publishing'
    description = 'Publishes every Signet publication to the local Maven repository.'
    dependsOn((rootProject.ext.signetJavaProjects + [':bom']).collect {
        "${it}:publishToMavenLocal"
    })
}

tasks.named('zipBundleForUpload') {
    dependsOn(tasks.named('publishAllToCentralBundle'))
}

subprojects {
    pluginManager.withPlugin("java") {
        dependencies {
            testImplementation "org.exploit:tss4j-natives:1.0.0:linux-amd64@jar"
            testImplementation "org.exploit:tss4j-natives:1.0.0:macos-aarch64@jar"
            testImplementation "org.exploit:tss4j-natives:1.0.0:windows-amd64@jar"
        }

        tasks.withType(Test).configureEach {
            jvmArgs '--enable-native-access=ALL-UNNAMED'
        }
    }
}

tasks.register('integrationTest') {
    group = 'verification'
    description = 'Runs the Java functional suites against Bitcoin Core, Anvil and Blockbook.'
    dependsOn ':integration-tests:functional:test'
}
