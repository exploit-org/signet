name: EVM integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evm-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evm:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Unit and local EVM integration tests
        run: ./gradlew :evm:test :evm:evm-contracts:test :evm:evm-spi:test :blockbook:test :blockbook:blockbook-evm:test :integration-tests:functional:evmTest --no-daemon --stacktrace
      - name: Preserve test reports and container logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evm-test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/
            integration-tests/functional/build/container-logs/
          retention-days: 14
