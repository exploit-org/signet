plugins {
    id 'java'
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    api platform("org.exploit.anvil:bom:${rootProject.ext.anvilVersion}")
    api 'org.exploit.anvil:ecc-ed25519'
    api project(':spi')
}

test {
    useJUnitPlatform()
}
